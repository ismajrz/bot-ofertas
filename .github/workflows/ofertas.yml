name: Ofertas a Discord

on:
  schedule:
    - cron: "*/10 * * * *"   # cada 10 minutos (GitHub puede retrasarlo)
  workflow_dispatch:          # botón para lanzarlo a mano desde la pestaña Actions
    inputs:
      desde:
        description: "Opcional: recuperar ofertas desde esta fecha (hora de España), p. ej. 2026-11-01 00:01"
        required: false
        default: ""

permissions:
  contents: write             # solo para el "mantener activo" de cada ~50 días

concurrency:
  group: ofertas
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # "Por dónde vamos" se guarda en la caché de GitHub, no en el historial del repositorio
      - name: Recuperar por dónde vamos
        uses: actions/cache/restore@v5
        with:
          path: estado.json
          key: estado-${{ github.run_id }}
          restore-keys: estado-

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Revisar canales y mandar ofertas
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_WEBHOOK_CHOLLOMETRO: ${{ secrets.DISCORD_WEBHOOK_CHOLLOMETRO }}
          DISCORD_WEBHOOK_STEAM: ${{ secrets.DISCORD_WEBHOOK_STEAM }}
          DESDE: ${{ github.event.inputs.desde }}
        run: python ofertas.py

      - name: Guardar por dónde vamos
        if: always()
        uses: actions/cache/save@v5
        with:
          path: estado.json
          key: estado-${{ github.run_id }}

      # GitHub pausa los bots de repositorios públicos sin cambios en 60 días.
      # Esto hace un cambio vacío como mucho una vez cada 50 días para que no se pause.
      - name: Mantener activo
        run: |
          ultimo=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - ultimo )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "bot-ofertas"
            git config user.email "bot-ofertas@users.noreply.github.com"
            git commit --allow-empty -m "Mantener activo" && git push
          fi
